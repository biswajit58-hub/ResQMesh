name: resqmesh
description: "ResQMesh - offline peer-to-peer disaster rescue and hazard intelligence network."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State, persistence and platform services
  provider: ^6.1.2
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  geolocator: ^14.0.2
  permission_handler: ^12.0.0
  connectivity_plus: ^7.0.0

  # Mapping
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  http: ^1.5.0

  # Protocol, security and utilities
  cryptography: ^2.7.0
  crypto: ^3.0.6
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.19.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/map/
